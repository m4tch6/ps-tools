<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>レヴュースタァライト 設定判別</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="../tool.css">
    <style>
        body { margin:0; -webkit-tap-highlight-color:transparent;
          font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
          font-feature-settings:"palt"; }
        .btn-base { transition: all 0.1s ease-out; touch-action: manipulation; user-select: none; }
        .btn-base:active:not(:disabled) { transform: scale(0.98); }
        .btn-base:disabled { opacity: 0.4; cursor: not-allowed; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* 旧テーマの赤系は sky に寄せて3ツールで統一 */
        .bg-starlight { background-color: #0284c7; }
        .text-starlight { color: #0284c7; }
        .border-starlight { border-color: #7dd3fc; }
        .text-gold { color: #b45309; }
        .text-rainbow { color: #0284c7; font-weight: 600; }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
          -webkit-appearance: none;
          margin: 0;
        }
    </style>
</head>
<body>
<a class="portal-back" href="../">← ツール一覧</a>
    <div id="root"></div>

    <script type="text/babel">
        /* @jsxRuntime classic */
        const { useState, useEffect, useMemo, useRef } = React;

        /* --- アイコン（絵文字は使わず3ツール共通のSVGで統一） --- */
        const Ico = ({ children, className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
            {children}
          </svg>
        );
        const IconRecord = ({ className }) => <Ico className={className}><path d="M8 6h11"/><path d="M8 12h11"/><path d="M8 18h11"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></Ico>;
        const IconResult = ({ className }) => <Ico className={className}><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 15v-3"/><path d="M12 15V8"/><path d="M17 15v-5"/></Ico>;
        const IconTable = ({ className }) => <Ico className={className}><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 9v12"/></Ico>;
        const IconUndo = ({ className }) => <Ico className={className}><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></Ico>;
        const IconRedo = ({ className }) => <Ico className={className}><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></Ico>;
        const IconData = ({ className }) => <Ico className={className}><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M17 21v-7H7v7"/><path d="M7 3v5h8"/></Ico>;

        // --- Data & Constants ---
        const SETTINGS = [1, 2, 4, 5, 6];

        const DATA = {
            cz: { 1: 265.9, 2: 254.7, 4: 207.6, 5: 190.3, 6: 179.5 },
            at: { 1: 359.6, 2: 346.8, 4: 277.1, 5: 255.7, 6: 232.5 },
            bonusProb: {
                rb: { 1: 621.9, 2: 604.3, 4: 526.3, 5: 499.7, 6: 465.0 },
                bb: { 1: 262.9, 2: 260.8, 4: 250.9, 5: 247.2, 6: 245.2 },
                total: { 1: 184.8, 2: 182.2, 4: 169.9, 5: 165.4, 6: 160.6 }
            },
            specificBonus: {
                'kirameki_reg': { 1: 7282, 2: 6554, 4: 4681, 5: 4096, 6: 3449 },
                'chance_reg':   { 1: 2341, 2: 2341, 4: 1820, 5: 1638, 6: 1560 },
                'watermelon_reg': { 1: 2731, 2: 2521, 4: 2114, 5: 2048, 6: 1771 },
                'watermelon_blue': { 1: 1285, 2: 1237, 4: 1170, 5: 1170, 6: 1150 },
                'chance_blue':     { 1: 2341, 2: 2341, 4: 1820, 5: 1638, 6: 1560 }
            },
            lamps: {
                white:  { 1: 32.1, 2: 31.5, 4: 25.8, 5: 23.3, 6: 21.8 },
                blue:   { 1: 33.2, 2: 33.1, 4: 29.1, 5: 27.5, 6: 26.5 },
                green:  { 1: 15.6, 2: 16.8, 4: 21.8, 5: 22.5, 6: 23.3 },
                red:    { 1: 15.4, 2: 14.0, 4: 15.2, 5: 14.8, 6: 14.4 },
                purple: { 1: 3.7,  2: 4.7,  4: 8.1,  5: 11.9, 6: 13.9 }
            },
            screens: {
                default: { 1: 92.6, 2: 92.6, 4: 85.6, 5: 84.4, 6: 83.1 },
                highWeak: { 1: 6.2, 2: 6.2, 4: 9.4, 5: 9.4, 6: 9.4 },
                highStrong: { 1: 1.3, 2: 1.3, 4: 5.0, 5: 6.3, 6: 7.5 }
            },
            voices: {
                default: { 1: 92.0, 2: 91.0, 4: 83.4, 5: 80.0, 6: 79.0 },
                highWeak: { 1: 6.3, 2: 6.3, 4: 10.0, 5: 12.5, 6: 12.5 },
                highStrong: { 1: 1.6, 2: 1.6, 4: 5.0, 5: 6.3, 6: 6.3 }
            }
        };

        const SMALL_ROLES = {
            kirameki: { name: 'キラめき目', prob: 20.9 },
            watermelon: { name: 'スイカ', prob: 95.4 },
            weakCherry: { name: '弱チェリー', prob: 111.1 },
            strongCherry: { name: '強チェリー', prob: 240.9 },
            chance: { name: 'チャンス目', prob: 292.6 },
            reach: { name: '中段チェリー', prob: 16384.0 }
        };

        const LABELS = {
            kirameki_reg: "キラめき目+REG",
            chance_reg: "チャンス目+REG",
            watermelon_reg: "スイカ+REG",
            watermelon_blue: "スイカ+青7",
            chance_blue: "チャンス目+青7"
        };

        // --- Calculation Helpers ---
        // Helper to get effective games based on user input and bonus counts
        const getEffectiveGames = (games, bonusCount) => {
            const currentTotal = parseInt(games.currentTotal) || 0;
            const startTotal = parseInt(games.startTotal) || 0;
            const currentNormal = parseInt(games.currentNormal) || 0;
            const startNormal = parseInt(games.startNormal) || 0;

            // Normal Games: Simple subtraction
            const normal = Math.max(0, currentNormal - startNormal);

            // Total Games (for probability): (Current - Start) - (BonusCount * 40)
            const rawDiffTotal = Math.max(0, currentTotal - startTotal);
            const bonusReduction = bonusCount * 40;
            const total = Math.max(0, rawDiffTotal - bonusReduction);

            return { normal, total, rawDiffTotal };
        };

        // --- Core Calculation Logic ---
        const calculateLikelihoods = (state) => {
            let likelihoods = { 1: 1, 2: 1, 4: 1, 5: 1, 6: 1 };
            
            const totalBonusCount = state.counts.bonus.red + state.counts.bonus.blue + state.counts.bonus.reg;
            const { normal, total } = getEffectiveGames(state.games, totalBonusCount);

            // 1. Game Count (CZ Misses) & CZ Hits
            // Uses 'normal' games for CZ probability
            SETTINGS.forEach(s => {
                const probHit = 1.0 / DATA.cz[s];
                const probMiss = 1.0 - probHit;
                
                // Scaling factor 100 for hits to prevent underflow
                likelihoods[s] *= Math.pow(probHit * 100, state.counts.cz);
                likelihoods[s] *= Math.pow(probMiss, normal);
            });

            // 2. Specific Bonuses
            Object.keys(state.counts.specificBonus).forEach(key => {
                const count = state.counts.specificBonus[key];
                if (count > 0) {
                    SETTINGS.forEach(s => {
                        const prob = 1.0 / DATA.specificBonus[key][s];
                        likelihoods[s] *= Math.pow(prob * 1000, count);
                    });
                }
            });

            // 3. Lamps
            Object.keys(state.counts.lamps).forEach(key => {
                const count = state.counts.lamps[key];
                if (count > 0) {
                    SETTINGS.forEach(s => {
                        likelihoods[s] *= Math.pow(DATA.lamps[key][s], count);
                    });
                }
            });

            // 4. Screens (Probabilistic + Hard Filter)
            Object.keys(state.counts.screens).forEach(key => {
                const count = state.counts.screens[key];
                if (count > 0) {
                    if (key.includes('over2')) likelihoods[1] = 0;
                    if (key.includes('over4') || key.includes('over456')) { likelihoods[1]=0; likelihoods[2]=0; }
                    if (key.includes('over5') || key.includes('over99')) { likelihoods[1]=0; likelihoods[2]=0; likelihoods[4]=0; }
                    if (key.includes('over6') || key.includes('over666')) { likelihoods[1]=0; likelihoods[2]=0; likelihoods[4]=0; likelihoods[5]=0; }

                    if (DATA.screens[key]) {
                        SETTINGS.forEach(s => {
                            likelihoods[s] *= Math.pow(DATA.screens[key][s], count);
                        });
                    }
                }
            });

            // 5. Voices (Probabilistic + Hard Filter)
            Object.keys(state.counts.voices).forEach(key => {
                const count = state.counts.voices[key];
                if (count > 0) {
                    if (key.includes('over2')) likelihoods[1] = 0;
                    if (key.includes('over4')) { likelihoods[1]=0; likelihoods[2]=0; }
                    if (key.includes('over6')) { likelihoods[1]=0; likelihoods[2]=0; likelihoods[4]=0; likelihoods[5]=0; }

                    if (DATA.voices[key]) {
                        SETTINGS.forEach(s => {
                            likelihoods[s] *= Math.pow(DATA.voices[key][s], count);
                        });
                    }
                }
            });

            // 6. Medals (Hard Filter only)
            Object.keys(state.counts.medals).forEach(key => {
                if (state.counts.medals[key] > 0) {
                    if (key.includes('over456')) { likelihoods[1]=0; likelihoods[2]=0; }
                    if (key.includes('over99')) { likelihoods[1]=0; likelihoods[2]=0; likelihoods[4]=0; }
                    if (key.includes('over666')) { likelihoods[1]=0; likelihoods[2]=0; likelihoods[4]=0; likelihoods[5]=0; }
                }
            });

            // Normalize
            const sum = Object.values(likelihoods).reduce((a,b)=>a+b, 0);
            if (sum > 0) {
                SETTINGS.forEach(s => likelihoods[s] /= sum);
            }
            
            return likelihoods;
        };

        const getTextColorClass = (key) => {
            if (key.includes('over2')) return 'text-sky-600 font-bold';
            if (key.includes('over4')) return 'text-sky-600 font-bold';
            if (key.includes('over5') || key.includes('over99')) return 'text-gold font-bold';
            if (key.includes('over6')) return 'text-rainbow font-bold';
            return 'text-zinc-700'; 
        };

        // --- 入力の自動保存（スマホでタブが破棄されても消えない） ---
        const SAVE = {
            KEY: "starlight_v1",
            load() { try { const r = localStorage.getItem(this.KEY); return r ? JSON.parse(r) : null; } catch (_) { return null; } },
            save(v) { try { localStorage.setItem(this.KEY, JSON.stringify(v)); } catch (_) {} },
            clear() { try { localStorage.removeItem(this.KEY); } catch (_) {} },
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('main');
            const [history, setHistory] = useState([]);
            const [future, setFuture] = useState([]);

            const [state, setState] = useState({
                games: { 
                    startTotal: 0, currentTotal: 0,
                    startNormal: 0, currentNormal: 0
                },
                counts: {
                    cz: 0, at: 0,
                    bonus: { red: 0, blue: 0, reg: 0 },
                    small: { kirameki: 0, watermelon: 0, weakCherry: 0, strongCherry: 0, chance: 0, reach: 0 },
                    specificBonus: {
                        kirameki_reg: 0, chance_reg: 0, watermelon_reg: 0, watermelon_blue: 0, chance_blue: 0
                    },
                    lamps: { white: 0, blue: 0, green: 0, red: 0, purple: 0 },
                    screens: { default: 0, highWeak: 0, highStrong: 0, over2: 0, over4: 0, over5: 0, over6: 0 }, 
                    voices: { default: 0, highWeak: 0, highStrong: 0, over2: 0, over4: 0, over6: 0 },
                    medals: { over456: 0, over99: 0, over666: 0 }
                },
                logs: []
            });
            
            const likelihoods = useMemo(() => calculateLikelihoods(state), [state]);

            const totalBonusCount = state.counts.bonus.red + state.counts.bonus.blue + state.counts.bonus.reg;
            const { normal: calcNormalGames, total: calcTotalGames, rawDiffTotal } = getEffectiveGames(state.games, totalBonusCount);

            const [modal, setModal] = useState(null); 
            const [importText, setImportText] = useState("");
            
            const [sbRole, setSbRole] = useState(null);
            const [sbType, setSbType] = useState(null);

            // --- 自動保存: 起動時に復元 → 以降は変更のたび保存 ---
            const [restored, setRestored] = useState(false);
            useEffect(() => {
                const d = SAVE.load();
                if (d) {
                    if (d.state) setState(d.state);
                    if (d.activeTab) setActiveTab(d.activeTab);
                    if (Array.isArray(d.history)) setHistory(d.history);
                }
                setRestored(true);
            }, []);
            useEffect(() => {
                if (!restored) return;
                SAVE.save({ state, activeTab, history: history.slice(-30) });
            }, [restored, state, activeTab, history]);

            const pushState = (newState, logMsg = null) => {
                const logEntry = logMsg ? { text: logMsg, time: new Date().toLocaleTimeString() } : null;
                const nextState = logEntry ? { ...newState, logs: [logEntry, ...newState.logs] } : newState;
                setHistory(prev => [...prev, state]);
                setState(nextState);
                setFuture([]);
            };

            const undo = () => {
                if (history.length === 0) return;
                const prev = history[history.length - 1];
                setFuture(prev => [state, ...prev]);
                setState(prev);
                setHistory(prev => prev.slice(0, -1));
            };

            const redo = () => {
                if (future.length === 0) return;
                const next = future[0];
                setHistory(prev => [...prev, state]);
                setState(next);
                setFuture(prev => prev.slice(1));
            };

            const changeGames = (key, value) => {
                const numVal = value === '' ? '' : parseInt(value); 
                const newState = { 
                    ...state, 
                    games: { ...state.games, [key]: numVal }
                };
                setState(newState); 
            };

            const updateSmallRole = (role, delta) => {
                const newState = { 
                    ...state, 
                    counts: { 
                        ...state.counts, 
                        small: { ...state.counts.small, [role]: Math.max(0, state.counts.small[role] + delta) } 
                    }
                };
                pushState(newState, delta > 0 ? `小役: ${SMALL_ROLES[role].name}` : null);
            };

            const recordCZ = () => {
                const newState = { ...state, counts: { ...state.counts, cz: state.counts.cz + 1 } };
                pushState(newState, "Challenge Revue当選");
            };

            const recordAT = () => {
                const newState = { ...state, counts: { ...state.counts, at: state.counts.at + 1 } };
                pushState(newState, "AT当選");
            };

            const handleBonusSubmit = () => {
                if (!sbRole || !sbType) return;
                
                let logText = "";
                let newState = { ...state };
                
                if (sbType === 'red') newState.counts.bonus.red++;
                else if (sbType === 'blue') newState.counts.bonus.blue++;
                else if (sbType === 'reg') newState.counts.bonus.reg++;

                const roleName = SMALL_ROLES[sbRole]?.name || sbRole;
                const typeName = sbType === 'red' ? '赤7' : sbType === 'blue' ? '青7' : 'REG';
                logText = `${roleName}+${typeName}`;

                let key = "";
                if (sbRole === 'kirameki' && sbType === 'reg') key = 'kirameki_reg';
                else if (sbRole === 'chance' && sbType === 'reg') key = 'chance_reg';
                else if (sbRole === 'watermelon' && sbType === 'reg') key = 'watermelon_reg';
                else if (sbRole === 'watermelon' && sbType === 'blue') key = 'watermelon_blue';
                else if (sbRole === 'chance' && sbType === 'blue') key = 'chance_blue';

                if (key) {
                    newState.counts.specificBonus[key] = (newState.counts.specificBonus[key] || 0) + 1;
                    logText += " (特定)";
                }

                pushState(newState, logText);
                setSbRole(null);
                setSbType(null);
                setModal(null);
            };

            const updateLamp = (color, delta) => {
                const currentCount = state.counts.lamps[color];
                if (delta < 0 && currentCount <= 0) return;

                const newState = { 
                    ...state, 
                    counts: { 
                        ...state.counts, 
                        lamps: { 
                            ...state.counts.lamps, 
                            [color]: Math.max(0, currentCount + delta) 
                        } 
                    } 
                };
                
                // Only log if adding, similar to small roles
                const lampNames = { white:'白', blue:'青', green:'緑', red:'赤', purple:'紫' };
                const logText = delta > 0 ? `ランプ: ${lampNames[color]}` : null;
                
                pushState(newState, logText);
            };

            const recordScreen = (type, category) => {
                const newState = { ...state, counts: { ...state.counts, [category]: { ...state.counts[category], [type]: state.counts[category][type] + 1 } } };
                pushState(newState, `示唆: ${type}`);
                setModal(null);
            };
            
            const resetAll = () => {
                if (confirm("全てのデータをリセットしますか？")) {
                    setState({
                        games: { startTotal: 0, currentTotal: 0, startNormal: 0, currentNormal: 0 },
                        counts: {
                            cz: 0, at: 0,
                            bonus: { red: 0, blue: 0, reg: 0 },
                            small: { kirameki: 0, watermelon: 0, weakCherry: 0, strongCherry: 0, chance: 0, reach: 0 },
                            specificBonus: { kirameki_reg: 0, chance_reg: 0, watermelon_reg: 0, watermelon_blue: 0, chance_blue: 0 },
                            lamps: { white: 0, blue: 0, green: 0, red: 0, purple: 0 },
                            screens: { default: 0, highWeak: 0, highStrong: 0, over2: 0, over4: 0, over5: 0, over6: 0 },
                            voices: { default: 0, highWeak: 0, highStrong: 0, over2: 0, over4: 0, over6: 0 },
                            medals: { over456: 0, over99: 0, over666: 0 }
                        },
                        logs: []
                    });
                    setHistory([]);
                    setFuture([]);
                }
            };
            
            const copyData = () => {
                navigator.clipboard.writeText(JSON.stringify(state)).then(() => alert("コピーしました"));
            };
            const pasteData = () => {
                try {
                    const data = JSON.parse(importText);
                    if (data.games) {
                        if (typeof data.games.total !== 'undefined') {
                            data.games = {
                                startTotal: 0, currentTotal: data.games.total,
                                startNormal: 0, currentNormal: data.games.normal
                            };
                        }
                        setState(data);
                        setHistory([]);
                        setModal(null);
                        alert("読み込みました");
                    }
                } catch(e) { alert("データ形式が正しくありません"); }
            };

            const PercentageBar = () => {
                const total = Object.values(likelihoods).reduce((a,b)=>a+b, 0);
                const maxVal = Math.max(...Object.values(likelihoods));
                
                return (
                    <div className="space-y-1.5">
                        {SETTINGS.map(s => {
                            const val = likelihoods[s];
                            const pct = total > 0 ? (val / total) * 100 : 0;
                            return (
                                <div key={s} className="flex items-center gap-2.5">
                                    {/* 設定1〜3は無彩色、4〜6は青（3ツール共通の配色） */}
                                    <span className="w-4 text-[11px] text-zinc-400 tabular-nums text-right">{s}</span>
                                    <div className="t-bar flex-1"><i className={`t-bar-${s}`} style={{ width: `${pct}%` }} /></div>
                                    <span className="w-12 text-right text-xs tabular-nums text-zinc-700">{pct.toFixed(1)}%</span>
                                </div>
                            );
                        })}
                    </div>
                );
            };

            const ScreenStats = ({ title, data, labels, baseKeys }) => {
                const total = Object.values(data).reduce((a, b) => a + b, 0);
                const baseTotal = baseKeys ? baseKeys.reduce((acc, k) => acc + (data[k]||0), 0) : 0;
                
                const calcProb = (count, denominator) => denominator > 0 ? ((count / denominator) * 100).toFixed(1) : '-';

                return (
                    <div className="t-card mb-4">
                        <h3 className="font-bold text-zinc-600 mb-3 text-sm">{title}</h3>
                        <table className="w-full text-xs text-center">
                            <thead className="bg-zinc-50 text-zinc-600">
                                <tr>
                                    <th className="py-2 align-middle">示唆内容</th>
                                    <th className="py-2 align-middle">回数</th>
                                    <th className="py-2 align-middle">割合</th>
                                    <th className="py-2 align-middle leading-tight">割合<br/><span className="text-[10px] font-normal opacity-90">(確定系除く)</span></th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-zinc-50">
                                {Object.keys(data).map(key => {
                                    const count = data[key];
                                    const isBase = baseKeys && baseKeys.includes(key);
                                    return (
                                        <tr key={key}>
                                            <td className={`py-2 ${getTextColorClass(key)}`}>{labels[key] || key}</td>
                                            <td>{count}</td>
                                            <td className="font-bold">{calcProb(count, total)}%</td>
                                            <td className={`font-bold ${isBase ? 'text-starlight' : 'text-zinc-300'}`}>
                                                {isBase ? `${calcProb(count, baseTotal)}%` : '-'}
                                            </td>
                                        </tr>
                                    );
                                })}
                                <tr className="bg-zinc-50/30 font-bold">
                                    <td className="py-2">合計</td>
                                    <td>{total}</td>
                                    <td>100%</td>
                                    <td>-</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                );
            };

            const BonusStats = () => {
                const { bonus } = state.counts;
                const totalBonus = bonus.red + bonus.blue + bonus.reg;
                
                const calcProb = (count) => count > 0 ? (calcTotalGames / count).toFixed(0) : '-';

                return (
                    <div className="t-card mb-4">
                        <h3 className="font-bold text-zinc-600 mb-3 text-sm">ボーナス確率詳細</h3>
                        <div className="text-[10px] text-zinc-400 mb-2 text-right">
                            有効総G数: {calcTotalGames}G (ボナ×40除外)
                        </div>
                        <table className="w-full text-xs text-center">

                    </div>

                    {modal === 'bonus' && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={() => setModal(null)}>
                            <div className="bg-white rounded-xl p-4 w-full max-w-sm space-y-4 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                                <h3 className="text-center font-bold text-starlight">ボーナス当選登録</h3>
                                
                                <div>
                                    <div className="text-xs font-bold text-zinc-500 mb-2">成立役</div>
                                    <div className="grid grid-cols-3 gap-2">
                                        {[
                                            {k:'kirameki',l:'キラめき目'},{k:'watermelon',l:'スイカ'},{k:'chance',l:'チャンス目'},
                                            {k:'weakCherry',l:'弱チェリー'},{k:'strongCherry',l:'強チェリー'},{k:'reach',l:'中段チェリー'}
                                        ].map(r => (
                                            <button key={r.k} onClick={() => setSbRole(r.k)} className={`py-2 border rounded-lg text-xs font-bold ${sbRole===r.k ? 'bg-starlight text-white border-starlight' : 'bg-white text-zinc-600 border-zinc-200'}`}>{r.l}</button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <div className="text-xs font-bold text-zinc-500 mb-2">ボーナス種別</div>
                                    <div className="grid grid-cols-3 gap-2">
                                        {[{k:'red',l:'赤7'},{k:'blue',l:'青7'},{k:'reg',l:'REG'}].map(t => (
                                            <button key={t.k} onClick={() => setSbType(t.k)} className={`py-2 border rounded-lg text-xs font-bold ${sbType===t.k ? 'bg-starlight text-white border-starlight' : 'bg-white text-zinc-600 border-zinc-200'}`}>{t.l}</button>
                                        ))}
                                    </div>
                                </div>

                                <button onClick={handleBonusSubmit} disabled={!sbRole || !sbType} className="w-full py-3 bg-starlight text-white rounded-lg font-bold disabled:opacity-50">登録</button>
                                <button onClick={() => setModal(null)} className="w-full py-2 text-zinc-400 text-xs">閉じる</button>
                            </div>
                        </div>
                    )}

                    {modal === 'screen' && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={() => setModal(null)}>
                            <div className="bg-white rounded-xl p-4 w-full max-w-sm space-y-4 max-h-[80vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                                <div>
                                    <h3 className="text-xs font-bold text-zinc-400 mb-2">BB終了画面</h3>
                                    <div className="grid grid-cols-3 gap-2">
                                        {[
                                            {k:'default',l:'デフォルト',c:'bg-zinc-50'},
                                            {k:'highWeak',l:'高設定 弱',c:'bg-zinc-50 text-zinc-700'},
                                            {k:'highStrong',l:'高設定 強',c:'bg-zinc-50 text-zinc-700'},
                                            {k:'over2',l:'設定2以上',c:'bg-sky-50 text-sky-600'},
                                            {k:'over4',l:'設定4以上',c:'bg-sky-50 text-sky-600'},
                                            {k:'over5',l:'設定5以上',c:'bg-sky-50 text-sky-600'},
                                            {k:'over6',l:'設定6確定',c:'bg-zinc-50 text-rainbow font-bold'}
                                        ].map(b => (
                                            <button key={b.k} onClick={() => recordScreen(b.k, 'screens')} className={`btn-base py-2 border rounded text-xs flex flex-col items-center ${b.c} ${b.k.startsWith('over') ? 'font-bold' : ''}`}>
                                                <span>{b.l}</span>
                                                <span className="text-[10px] font-bold mt-1">({state.counts.screens[b.k]})</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <h3 className="text-xs font-bold text-zinc-400 mb-2">AT終了時ボイス</h3>
                                    <div className="grid grid-cols-2 gap-2">
                                        {[
                                            {k:'default',l:'デフォルト',c:'bg-zinc-50'},
                                            {k:'highWeak',l:'高設定 弱',c:'bg-zinc-50 text-zinc-700'},
                                            {k:'highStrong',l:'高設定 強',c:'bg-zinc-50 text-zinc-700'},
                                            {k:'over2',l:'設定2以上',c:'bg-sky-50 text-sky-600'},
                                            {k:'over4',l:'設定4以上',c:'bg-sky-50 text-sky-600'},
                                            {k:'over6',l:'設定6確定',c:'bg-zinc-50 text-rainbow font-bold'}
                                        ].map(b => (
                                            <button key={b.k} onClick={() => recordScreen(b.k, 'voices')} className={`btn-base py-2 border rounded text-xs flex flex-col items-center ${b.c}`}>
                                                <span>{b.l}</span>
                                                <span className="text-[10px] font-bold mt-1">({state.counts.voices[b.k]})</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <h3 className="text-xs font-bold text-zinc-400 mb-2">枚数表示</h3>
                                    <div className="grid grid-cols-3 gap-2">
                                        {[
                                            {k:'over456',l:'456 OVER',c:'bg-sky-50 text-sky-600'},
                                            {k:'over99',l:'99 OVER',c:'bg-sky-50 text-sky-600'},
                                            {k:'over666',l:'666 OVER',c:'bg-zinc-50 text-rainbow font-bold'}
                                        ].map(b => (
                                            <button key={b.k} onClick={() => recordScreen(b.k, 'medals')} className={`btn-base py-2 border rounded text-xs flex flex-col items-center ${b.c}`}>
                                                <span>{b.l}</span>
                                                <span className="text-[10px] font-bold mt-1">({state.counts.medals[b.k]})</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <button onClick={() => setModal(null)} className="w-full py-2 text-zinc-400 text-xs">閉じる</button>
                            </div>
                        </div>
                    )}

                    {modal === 'save' && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={() => setModal(null)}>
                            <div className="bg-white rounded-xl p-4 w-full max-w-sm space-y-3" onClick={e => e.stopPropagation()}>
                                <h3 className="text-center font-bold text-zinc-700">データ保存・読込</h3>
                                <button onClick={copyData} className="btn-base w-full py-3 bg-starlight text-white rounded-lg font-bold">クリップボードにコピー</button>
                                <textarea 
                                    className="w-full h-20 p-2 border rounded-lg text-xs bg-zinc-50" 
                                    placeholder="ここにデータを貼り付け"
                                    value={importText}
                                    onChange={e => setImportText(e.target.value)}
                                />
                                <button onClick={pasteData} className="btn-base w-full py-3 bg-zinc-700 text-white rounded-lg font-bold">読み込み</button>
                            </div>
                        </div>
                    )}

                    <nav className="t-tabs">
                        <button onClick={() => { setActiveTab('main'); window.scrollTo(0,0); }} className={`t-tab ${activeTab === 'main' ? 'on' : ''}`}>
                            <IconRecord className="w-[18px] h-[18px]" />
                            記録
                        </button>
                        <button onClick={() => { setActiveTab('counter'); window.scrollTo(0,0); }} className={`t-tab ${activeTab === 'counter' ? 'on' : ''}`}>
                            <IconResult className="w-[18px] h-[18px]" />
                            判別結果
                        </button>
                        <button onClick={() => { setActiveTab('db'); window.scrollTo(0,0); }} className={`t-tab ${activeTab === 'db' ? 'on' : ''}`}>
                            <IconTable className="w-[18px] h-[18px]" />
                            データベース
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
