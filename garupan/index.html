<body>
<a class="portal-back" href="../">← ツール一覧</a>
    <div id="root"></div>

    <script type="text/babel">
        /* @jsxRuntime classic */
        const { useState, useEffect, useRef } = React;

        /* --- アイコン（絵文字は使わず3ツール共通のSVGで統一） --- */
        const Ico = ({ children, className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
            {children}
          </svg>
        );
        const IconRecord = ({ className }) => <Ico className={className}><path d="M8 6h11"/><path d="M8 12h11"/><path d="M8 18h11"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></Ico>;
        const IconResult = ({ className }) => <Ico className={className}><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 15v-3"/><path d="M12 15V8"/><path d="M17 15v-5"/></Ico>;
        const IconUndo = ({ className }) => <Ico className={className}><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></Ico>;
        const IconRedo = ({ className }) => <Ico className={className}><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></Ico>;
        const IconData = ({ className }) => <Ico className={className}><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M17 21v-7H7v7"/><path d="M7 3v5h8"/></Ico>;

        // --- Constants & Probability Tables ---
        const SETTINGS = [1, 2, 3, 4, 5, 6];
        const STATES = { NORMAL: 0, HIGHA: 1, HIGHB: 2, ULTRA: 3 };
        const STATE_NAMES = ["通常", "高確A", "高確B", "超高確"];

        // Distributions (Length 4)
        const AT_END_DIST = [0.797, 0.195, 0.004, 0.004]; 
        const NORMAL_START_DIST = [1.0, 0, 0, 0];

        // Rewrite Rates
        const REWRITE_RATES = { WEAK_CHERRY: 0.031, STRONG_RARE: 0.203, STRONG_CHERRY: 0.402, BELL_7: 0.0 };
        const CE_REWRITE_RATES = { WEAK_CHERRY: 0.25, STRONG_RARE: 1.0, STRONG_CHERRY: 1.0, BELL_7: 0.0 };
        
        // Development Rates
        const CE_DEV_RATES = {
            WEAK_CHERRY: [0.004, 0.008, 0.016, 0.016], 
            STRONG_RARE: [0.500, 0.602, 0.750, 0.750], 
            STRONG_CHERRY: [1.0, 1.0, 1.0, 1.0], 
            BELL_7: [0.301, 0.301, 0.301, 0.301]
        };

        // Success Rates
        const CE_SUCCESS_RATES = [0.241, 0.361, 0.401, 1.0]; 

        // Transitions (合計が厳密に1.000になるよう修正済み)
        const TRANSITION_WEAK_CHERRY_FROM_NORMAL = { 
            1: [0.808, 0.172, 0.020, 0.000], 2: [0.797, 0.180, 0.023, 0.000], 
            3: [0.781, 0.188, 0.031, 0.000], 4: [0.640, 0.313, 0.047, 0.000], 
            5: [0.621, 0.328, 0.051, 0.000], 6: [0.601, 0.344, 0.055, 0.000] 
        };
        const TRANSITION_WEAK_CHERRY_FROM_HIGHA = { 
            1: [0, 0.898, 0.098, 0.004], 2: [0, 0.891, 0.105, 0.004], 
            3: [0, 0.867, 0.129, 0.004], 4: [0, 0.781, 0.215, 0.004], 
            5: [0, 0.766, 0.230, 0.004], 6: [0, 0.750, 0.246, 0.004] 
        };

        const TRANSITION_CE_FAIL_FROM_NORMAL = { 
            1: [0.804, 0.172, 0.020, 0.004], 2: [0.793, 0.180, 0.023, 0.004], 
            3: [0.777, 0.188, 0.031, 0.004], 4: [0.636, 0.313, 0.047, 0.004], 
            5: [0.617, 0.328, 0.051, 0.004], 6: [0.597, 0.344, 0.055, 0.004] 
        };
        const TRANSITION_CE_FAIL_FROM_HIGHA = { 
            1: [0, 0.898, 0.098, 0.004], 2: [0, 0.891, 0.105, 0.004], 
            3: [0, 0.867, 0.129, 0.004], 4: [0, 0.781, 0.215, 0.004], 
            5: [0, 0.766, 0.230, 0.004], 6: [0, 0.750, 0.246, 0.004] 
        };

        const EPSILON = 1e-20;
        const clampProb = (p) => Math.min(Math.max(p, 0.0001), 0.9999);
        
        const normalizeLikelihoods = (likelihoods) => {
            if (!Array.isArray(likelihoods) || likelihoods.length < 7) return [0, 1, 1, 1, 1, 1, 1];
            let sum = 0;
            for (let i = 1; i < likelihoods.length; i++) {
                const val = parseFloat(likelihoods[i]);
                sum += (isNaN(val) || val < 0) ? 0 : val;
            }
            if (sum <= 0) return [0, 1, 1, 1, 1, 1, 1];
            const newLikelihoods = [...likelihoods];
            for (let i = 1; i < newLikelihoods.length; i++) {
                let v = newLikelihoods[i];
                if (isNaN(v) || v < 0) v = 0;
                newLikelihoods[i] = v / sum;
            }
            return newLikelihoods;
        };

        const calcTransition = (currentDist, tableNormal, tableHighA, setting) => {
            const nextDist = [0, 0, 0, 0];
            const safeDist = (Array.isArray(currentDist) && currentDist.length >= 4) ? currentDist : NORMAL_START_DIST;
            
            const pNormal = safeDist[STATES.NORMAL] || 0;
            const pHighA = safeDist[STATES.HIGHA] || 0;
            const pHighB = safeDist[STATES.HIGHB] || 0;
            const pUltra = safeDist[STATES.ULTRA] || 0;

            const tn = tableNormal[setting] || [1,0,0,0];
            for(let i=0; i<4; i++) nextDist[i] += pNormal * tn[i];

            const ta = tableHighA[setting] || [1,0,0,0];
            for(let i=0; i<4; i++) nextDist[i] += pHighA * ta[i];

            nextDist[STATES.HIGHB] += pHighB * 0.996;
            nextDist[STATES.ULTRA] += pHighB * 0.004;
            nextDist[STATES.ULTRA] += pUltra;

            return nextDist;
        };

        const createInitialStateProbs = (dist) => Array.from({ length: 7 }, () => [...dist]);

        // デバッグ済: 完全な条件付き確率ツリーによる見かけ上の確率算出
        const getApparentProbs = (dist, trigger, bellCount, pRwPre, pRwCe, isSecondCE) => {
            const safeDist = dist || NORMAL_START_DIST;
            
            let pDev = 0;
            // 第2前兆(どん底)経由の場合は、自力発展率を100%として計算する
            if (isSecondCE) {
                pDev = 1.0;
            } else {
                const devRates = CE_DEV_RATES[trigger] || [0,0,0,0];
                pDev += safeDist[STATES.NORMAL] * devRates[0];
                pDev += safeDist[STATES.HIGHA] * devRates[1];
                pDev += safeDist[STATES.HIGHB] * devRates[2];
                let ultraDevRate = devRates[3];
                if (trigger === 'BELL_7' && bellCount >= 2) ultraDevRate = 1.0;
                pDev += safeDist[STATES.ULTRA] * ultraDevRate;
            }

            let pSuccGivenDev = 0;
            const succRates = CE_SUCCESS_RATES;
            pSuccGivenDev += safeDist[STATES.NORMAL] * succRates[0];
            pSuccGivenDev += safeDist[STATES.HIGHA] * succRates[1];
            pSuccGivenDev += safeDist[STATES.HIGHB] * succRates[2];
            let ultraSuccRate = 1.0;
            if (trigger === 'BELL_7' && bellCount < 2) ultraSuccRate = 0.301;
            pSuccGivenDev += safeDist[STATES.ULTRA] * ultraSuccRate;

            // STEP 1 (発展判定)
            const pNotDevApparent = (1.0 - pDev) * (1.0 - pRwPre);
            const pDevApparent = pDev + (1.0 - pDev) * pRwPre;

            // STEP 2 (当落判定: 連演書き換えは発展した場合のみ受けられる)
            const pFailTotal = (1.0 - pRwPre) * pDev * (1.0 - pSuccGivenDev) * (1.0 - pRwCe);
            const pSuccTotal = pRwPre + (1.0 - pRwPre) * pDev * (pSuccGivenDev + (1.0 - pSuccGivenDev) * pRwCe);

            // 尤度に掛けるのは「発展したという条件下での確率」
            const pFailGivenDevApparent = pDevApparent > 0 ? pFailTotal / pDevApparent : 0;
            const pSuccGivenDevApparent = pDevApparent > 0 ? pSuccTotal / pDevApparent : 0;

            return {
                pNotDevApparent,
                pDevApparent,
                pFailGivenDevApparent,
                pSuccGivenDevApparent
            };
        };

        // --- 入力の自動保存（スマホでタブが破棄されても消えない） ---
        const SAVE = {
            KEY: "garupan_v1",
            load() { try { const r = localStorage.getItem(this.KEY); return r ? JSON.parse(r) : null; } catch (_) { return null; } },
            save(v) { try { localStorage.setItem(this.KEY, JSON.stringify(v)); } catch (_) {} },
            clear() { try { localStorage.removeItem(this.KEY); } catch (_) {} },
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('main');
            const [history, setHistory] = useState([]);
            const [future, setFuture] = useState([]);
            
            const [simState, setSimState] = useState({
                stateProbs: createInitialStateProbs(NORMAL_START_DIST), 
                settingLikelihoods: Array(7).fill(1.0),
                snapshotProbs: createInitialStateProbs(NORMAL_START_DIST), 
                isAtEnd: false, isPrecursor: false, inCE: false, 
                isSecondCE: false, // 1回目失敗経由のどん底フラグ(計算用)
                isDondoko: false,  // UI表示・直行どん底含む滞在フラグ
                
                precursorRewriteChance: 0.0, 
                ceRewriteChance: 0.0,
                
                pFail1stApparents: Array(7).fill(1.0),

                log: [], lastTrigger: null, bell7Count: 0 
            });

            const [counters, setCounters] = useState({
                atScreens: { default: 0, highWeak: 0, highStrong: 0, ka: 0, kichi: 0, ryo: 0, yu: 0, kiwami: 0 },
                suggestions: { set2: false, set3: false, set4: false, set5: false }
            });

            const [showRareMenu, setShowRareMenu] = useState(false);
            const [showDataModal, setShowDataModal] = useState(false);
            const [importText, setImportText] = useState("");

            // --- 自動保存: 起動時に復元 → 以降は変更のたび保存 ---
            const [restored, setRestored] = useState(false);
            useEffect(() => {
                const d = SAVE.load();
                if (d) {
                    if (d.simState) setSimState(d.simState);
                    if (d.counters) setCounters(d.counters);
                    if (d.activeTab) setActiveTab(d.activeTab);
                    if (Array.isArray(d.history)) setHistory(d.history);
                }
                setRestored(true);
            }, []);
            useEffect(() => {
                if (!restored) return;
                SAVE.save({ simState, counters, activeTab, history: history.slice(-30) });
            }, [restored, simState, counters, activeTab, history]);

            // --- Logic ---
            const pushHistory = (newState) => {
                setHistory(prev => [...prev, simState]);
                setSimState(newState);
                setFuture([]);
            };
            const undo = () => {
                if (history.length === 0) return;
                const prev = history[history.length - 1];
                setFuture(prevFuture => [simState, ...prevFuture]);
                setSimState(prev);
                setHistory(prevHistory => prevHistory.slice(0, -1));
            };
            const redo = () => {
                if (future.length === 0) return;
                const next = future[0];
                setHistory(prevHistory => [...prevHistory, simState]);
                setSimState(next);
                setFuture(prevFuture => prevFuture.slice(1));
            };
            const resetAll = () => {
                if(!confirm("データをリセットしますか？")) return;
                setSimState({
                    stateProbs: createInitialStateProbs(NORMAL_START_DIST),
                    settingLikelihoods: Array(7).fill(1.0),
                    snapshotProbs: createInitialStateProbs(NORMAL_START_DIST),
                    isAtEnd: false, isPrecursor: false, inCE: false, isSecondCE: false, isDondoko: false,
                    precursorRewriteChance: 0.0, ceRewriteChance: 0.0, pFail1stApparents: Array(7).fill(1.0),
                    log: [], lastTrigger: null, bell7Count: 0
                });
                setCounters({ atScreens: { default: 0, highWeak: 0, highStrong: 0, ka: 0, kichi: 0, ryo: 0, yu: 0, kiwami: 0 }, suggestions: { set2: false, set3: false, set4: false, set5: false } });
                setHistory([]); setFuture([]);
            };
            const updateCounter = (key, delta) => setCounters(prev => ({ ...prev, atScreens: { ...prev.atScreens, [key]: Math.max(0, prev.atScreens[key] + delta) } }));
            const copyToClipboard = () => { const data = JSON.stringify({ simState, counters }); const ta = document.createElement("textarea"); ta.value = data; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert("コピーしました"); };
            const importData = () => { try { if (!importText) return; const data = JSON.parse(importText); if (data.simState && data.counters) { setSimState(data.simState); setCounters(data.counters); setHistory([]); setFuture([]); setShowDataModal(false); setImportText(""); alert("読み込みました"); } } catch (e) { alert("読み込み失敗"); } };

            const handleToggleAT = () => {
                const newState = { ...simState, isAtEnd: !simState.isAtEnd };
                const dist = newState.isAtEnd ? AT_END_DIST : NORMAL_START_DIST;
                newState.stateProbs = createInitialStateProbs(dist); newState.snapshotProbs = createInitialStateProbs(dist);
                newState.bell7Count = 0;
                newState.log = [{ text: newState.isAtEnd ? "AT終了後スタート" : "通常スタート", type: "system" }, ...newState.log];
                pushHistory(newState);
            };

            const handleTogglePrecursor = () => {
                if (simState.isPrecursor || simState.inCE) return;
                let s = { ...simState };
                s.isPrecursor = true;
                s.log = [{ text: "前兆開始 (書き換え抽選有効)", type: "system" }, ...s.log];
                pushHistory(s);
            };
            
            const handle100G = () => {
                let s = { ...simState };
                s.stateProbs = s.stateProbs.map(d => {
                    const n = [0,0,0,0];
                    n[STATES.HIGHA] += d[STATES.NORMAL]||0; n[STATES.HIGHB] += d[STATES.HIGHA]||0; 
                    n[STATES.ULTRA] += (d[STATES.HIGHB]||0) + (d[STATES.ULTRA]||0);
                    return n;
                });
                if (!s.isPrecursor && !s.inCE) s.snapshotProbs = JSON.parse(JSON.stringify(s.stateProbs));
                s.log = [{ text: "100G消化 (状態昇格)", type: "event" }, ...s.log];
                pushHistory(s);
            };

            const handleJohannesburg = () => {
                let s = { ...simState };

                s.settingLikelihoods = s.settingLikelihoods.map((l, i) => {
                    if (i === 0) return 0;
                    const pNormal = s.stateProbs[i][STATES.NORMAL] || 0;
                    const pNotNormal = 1.0 - pNormal;
                    return Math.max(l * clampProb(pNotNormal), EPSILON);
                });
                s.settingLikelihoods = normalizeLikelihoods(s.settingLikelihoods);

                s.stateProbs = s.stateProbs.map((d, i) => {
                    if (i === 0) return d;
                    const n = [...d];
                    const sumNotNormal = (n[STATES.HIGHA] || 0) + (n[STATES.HIGHB] || 0) + (n[STATES.ULTRA] || 0);
                    
                    if (sumNotNormal > 0) {
                        n[STATES.HIGHA] = (n[STATES.HIGHA] || 0) / sumNotNormal;
                        n[STATES.HIGHB] = (n[STATES.HIGHB] || 0) / sumNotNormal;
                        n[STATES.ULTRA] = (n[STATES.ULTRA] || 0) / sumNotNormal;
                    } else {
                        n[STATES.HIGHA] = 1.0;
                        n[STATES.HIGHB] = 0;
                        n[STATES.ULTRA] = 0;
                    }
                    n[STATES.NORMAL] = 0;
                    return n;
                });

                s.log = [{ text: "ヨハネスブルグ (通常否定)", type: "important" }, ...s.log];
                pushHistory(s);
            };

            const handleCeiling = () => {
                let s = { ...simState };
                s.stateProbs = createInitialStateProbs(NORMAL_START_DIST); s.snapshotProbs = createInitialStateProbs(NORMAL_START_DIST);
                s.isPrecursor = false; s.inCE = false; s.isSecondCE = false; s.isDondoko = false;
                s.precursorRewriteChance = 0.0; s.ceRewriteChance = 0.0; s.bell7Count = 0;
                s.log = [{ text: "天井到達 (CZ当選)", type: "result-good" }, ...s.log];
                pushHistory(s);
            };

            const handleTrigger = (type) => {
                let s = { ...simState };
                
                if (type === 'BELL_7') s.bell7Count = (s.bell7Count || 0) + 1;

                let logText = type === 'BELL_7' ? "ベル7回" : type === 'WEAK_CHERRY' ? "弱チェリー" : type === 'STRONG_RARE' ? "強レア役" : "強チェリー";

                if (!s.isPrecursor && !s.inCE) {
                    s.lastTrigger = type;
                    s.snapshotProbs = JSON.parse(JSON.stringify(s.stateProbs));
                    
                    if (type === 'WEAK_CHERRY') {
                        s.stateProbs = s.stateProbs.map((d, i) => {
                            if (i === 0) return d;
                            return calcTransition(d, TRANSITION_WEAK_CHERRY_FROM_NORMAL, TRANSITION_WEAK_CHERRY_FROM_HIGHA, i);
                        });
                    }
                }

                if (s.isPrecursor && !s.inCE) {
                    const rate = REWRITE_RATES[type] || 0;
                    s.precursorRewriteChance = 1.0 - ((1.0 - s.precursorRewriteChance) * (1.0 - rate));
                } else if (s.inCE) {
                    const rate = CE_REWRITE_RATES[type] || 0;
                    s.ceRewriteChance = 1.0 - ((1.0 - s.ceRewriteChance) * (1.0 - rate));
                }

                if (s.inCE) {
                    logText += " (連演中)";
                } else if (s.isPrecursor) {
                    logText += " (前兆中)";
                }
                
                let newLogs = [{ text: logText, type: type === 'BELL_7' ? "event" : "role" }];

                // 自動前兆開始
                if ((type === 'STRONG_RARE' || type === 'STRONG_CHERRY' || type === 'BELL_7') && !s.isPrecursor && !s.inCE) {
                    s.isPrecursor = true; newLogs.unshift({ text: "前兆開始 (書き換え抽選有効)", type: "system" });
                }

                s.log = [...newLogs, ...s.log];
                pushHistory(s);
                setShowRareMenu(false);
            };

            const handleNotDev = () => {
                let s = { ...simState };
                const trigger = s.lastTrigger || 'WEAK_CHERRY';
                const source = s.snapshotProbs; 

                s.settingLikelihoods = s.settingLikelihoods.map((l, i) => {
                    if (i === 0) return 0;
                    const probs = getApparentProbs(source[i], trigger, s.bell7Count, s.precursorRewriteChance, s.ceRewriteChance, s.isSecondCE);
                    return Math.max(l * clampProb(probs.pNotDevApparent), EPSILON);
                });
                s.settingLikelihoods = normalizeLikelihoods(s.settingLikelihoods);
                s.isPrecursor = false; s.inCE = false; s.isSecondCE = false; s.isDondoko = false;
                s.precursorRewriteChance = 0.0; s.ceRewriteChance = 0.0;
                s.log = [{ text: "非発展 (終了)", type: "result-bad" }, ...s.log];
                pushHistory(s);
            };

            const handleDirectDondoko = () => {
                let s = { ...simState };
                s.isDondoko = true; 
                s.pFail1stApparents = Array(7).fill(1.0); 
                s.log = [{ text: "どん底移行 (直行)", type: "important" }, ...s.log];
                pushHistory(s);
            };

            const handleDev = () => {
                let s = { ...simState };
                s.inCE = true; 
                s.isPrecursor = false;
                const trigger = s.lastTrigger || 'WEAK_CHERRY';
                
                s.settingLikelihoods = s.settingLikelihoods.map((l, i) => {
                    if (i === 0) return 0;
                    if (s.isSecondCE) return l; // 1回目失敗経由のどん底は評価済みなのでパス

                    // 1回目の発展（直行どん底含む）は尤度を掛ける
                    const probs = getApparentProbs(s.snapshotProbs[i], trigger, s.bell7Count, s.precursorRewriteChance, s.ceRewriteChance, s.isSecondCE);
                    return Math.max(l * clampProb(probs.pDevApparent), EPSILON);
                });
                s.settingLikelihoods = normalizeLikelihoods(s.settingLikelihoods);
                
                const text = s.isSecondCE ? "連続演出発展 (2回目)" : "連続演出発展";
                s.log = [{ text: text, type: "event" }, ...s.log];
                
                s.isDondoko = false; // 発展したのでどん底前兆状態は終了
                pushHistory(s);
            };

            const handleFailNext = () => {
                let s = { ...simState };
                const source = s.snapshotProbs;
                const trigger = s.lastTrigger;
                
                s.pFail1stApparents = Array(7).fill(1.0);

                s.settingLikelihoods = s.settingLikelihoods.map((l, i) => {
                    if (i === 0) return 0;
                    const probs = getApparentProbs(source[i], trigger, s.bell7Count, s.precursorRewriteChance, s.ceRewriteChance, s.isSecondCE);
                    const factor = clampProb(probs.pFailGivenDevApparent);
                    s.pFail1stApparents[i] = factor; 
                    return Math.max(l * factor, EPSILON);
                });
                s.settingLikelihoods = normalizeLikelihoods(s.settingLikelihoods);

                s.stateProbs = s.stateProbs.map((d, i) => {
                    if (i === 0) return d;
                    return calcTransition(d, TRANSITION_CE_FAIL_FROM_NORMAL, TRANSITION_CE_FAIL_FROM_HIGHA, i);
                });

                // どん底（第2前兆）へ移行
                s.inCE = false; s.isPrecursor = true; 
                s.isSecondCE = true; s.isDondoko = true; 
                s.precursorRewriteChance = 0.0; s.ceRewriteChance = 0.0; 
                s.log = [{ text: "失敗 (どん底→前兆)", type: "result-bad" }, ...s.log];
                pushHistory(s);
            };

            const handleFailEnd = () => {
                let s = { ...simState };
                const source = s.snapshotProbs;
                const trigger = s.lastTrigger;

                s.settingLikelihoods = s.settingLikelihoods.map((l, i) => {
                    if (i === 0) return 0;
                    let currentL = l;
                    if (s.isSecondCE) {
                        currentL = currentL / clampProb(s.pFail1stApparents[i]);
                    }
                    const probs = getApparentProbs(source[i], trigger, s.bell7Count, s.precursorRewriteChance, s.ceRewriteChance, s.isSecondCE);
                    return Math.max(currentL * clampProb(probs.pFailGivenDevApparent), EPSILON);
                });
                s.settingLikelihoods = normalizeLikelihoods(s.settingLikelihoods);

                s.stateProbs = s.stateProbs.map((d, i) => {
                    if (i === 0) return d;
                    return calcTransition(d, TRANSITION_CE_FAIL_FROM_NORMAL, TRANSITION_CE_FAIL_FROM_HIGHA, i);
                });

                s.inCE = false; s.isPrecursor = false; s.isSecondCE = false; s.isDondoko = false;
                s.precursorRewriteChance = 0.0; s.ceRewriteChance = 0.0;
                s.log = [{ text: "失敗 (通常へ)", type: "result-bad" }, ...s.log];
                pushHistory(s);
            };

            const handleSuccess = () => {
                let s = { ...simState };
                const source = s.snapshotProbs;
                const trigger = s.lastTrigger;

                s.settingLikelihoods = s.settingLikelihoods.map((l, i) => {
                    if (i === 0) return 0;
                    let currentL = l;
                    if (s.isSecondCE) {
                        currentL = currentL / clampProb(s.pFail1stApparents[i]);
                    }
                    const probs = getApparentProbs(source[i], trigger, s.bell7Count, s.precursorRewriteChance, s.ceRewriteChance, s.isSecondCE);
                    return Math.max(currentL * clampProb(probs.pSuccGivenDevApparent), EPSILON);
                });
                s.settingLikelihoods = normalizeLikelihoods(s.settingLikelihoods);

                s.stateProbs = createInitialStateProbs(NORMAL_START_DIST); s.snapshotProbs = createInitialStateProbs(NORMAL_START_DIST);
                s.log = [{ text: "成功 (CZ当選)", type: "result-good" }, ...s.log];
                s.precursorRewriteChance = 0.0; s.ceRewriteChance = 0.0; 
                s.isPrecursor = false; s.isAtEnd = false; s.inCE = false; s.isSecondCE = false; s.isDondoko = false;
                s.bell7Count = 0;
                pushHistory(s);
            };

            const getSettingPercentages = () => {
                if (!simState.settingLikelihoods || !Array.isArray(simState.settingLikelihoods)) return [0,0,0,0,0,0,0];
                let probs = [...simState.settingLikelihoods];
                if (counters.suggestions.set2) probs[1] = 0; 
                if (counters.suggestions.set3) { probs[1] = 0; probs[2] = 0; }
                if (counters.suggestions.set4) { probs[1]=0; probs[2]=0; probs[3]=0; } 
                if (counters.suggestions.set5) { probs[1]=0; probs[2]=0; probs[3]=0; probs[4]=0; }
                
                const total = probs.slice(1).reduce((a, b) => a + (b || 0), 0);
                if (total === 0 || isNaN(total)) return [0,0,0,0,0,0,0];
                return probs.map(p => ((p || 0) / total) * 100);
            };
            
            const pct = getSettingPercentages();
            
            const totalRewriteChance = 1.0 - (1.0 - simState.precursorRewriteChance) * (1.0 - simState.ceRewriteChance);

            return (
                <div className="t-app">
                    <header className="t-head">
                        <div className="t-head-row">
                            <h1 className="t-title">ガルパン最終章<span>設定判別</span></h1>
                            <div className="flex gap-1.5">
                                <button onClick={undo} disabled={history.length===0} className="t-iconbtn btn-base" aria-label="ひとつ戻す"><IconUndo className="w-4 h-4" /></button>
                                <button onClick={redo} disabled={future.length===0} className="t-iconbtn btn-base" aria-label="ひとつ進める"><IconRedo className="w-4 h-4" /></button>
                                <button onClick={() => setShowDataModal(true)} className="t-iconbtn btn-base" aria-label="データ管理"><IconData className="w-4 h-4" /></button>
                            </div>
                        </div>
                        <div className="flex items-center gap-1 mt-2.5">
                            {[
                                { on: !simState.isPrecursor && !simState.inCE, label: "通常" },
                                { on: simState.isPrecursor && !simState.inCE, label: simState.isDondoko ? "どん底(前兆)" : "前兆" },
                                { on: simState.inCE, label: simState.isSecondCE ? "連演(2回目)" : "連演" },
                            ].map((p, i) => (
                                <React.Fragment key={i}>
                                    {i > 0 && <span className="text-zinc-300 text-[11px]">›</span>}
                                    <div className={`flex-1 text-center py-1.5 rounded-md text-[11px] font-medium transition-colors ${p.on ? "bg-sky-50 text-sky-700 ring-1 ring-sky-200" : "text-zinc-400 bg-zinc-50"}`}>
                                        {p.label}
                                    </div>
                                </React.Fragment>
                            ))}
                        </div>
                        {(simState.isPrecursor || simState.inCE) && (
                            <div className="mt-1.5 text-[10.5px] text-center text-zinc-500 tabular-nums">
                                書き換え期待度 <b className="text-sky-600 font-medium">{(totalRewriteChance * 100).toFixed(1)}%</b>
                            </div>
                        )}
                    </header>

                    <div className="t-body">
                        {activeTab === 'main' ? (
                            <div className="pt-4 space-y-5">
                                <div className="flex items-center gap-2">
                                    <span className="t-sec">現在の区間</span>
                                    <button onClick={handleToggleAT} className={`t-btn sm ml-auto btn-base ${simState.isAtEnd ? "sel" : ""}`}>
                                        AT終了後 {simState.isAtEnd ? 'ON' : 'OFF'}
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 gap-2.5">
                                    <div className="relative row-span-2 min-h-[104px]">
                                        <button onClick={() => setShowRareMenu(!showRareMenu)} className="btn-base t-btn w-full h-full flex-col gap-0.5">
                                            <span className="text-[15px] font-semibold">レア役</span>
                                            <span className="text-[10.5px] text-zinc-400 font-normal">タップして選択</span>
                                        </button>
                                        {showRareMenu && (
                                            <div className="absolute inset-0 bg-white border border-zinc-200 rounded-[9px] shadow-lg z-20 flex flex-col overflow-hidden">
                                                <button onClick={() => handleTrigger('WEAK_CHERRY')} className="flex-1 border-b border-zinc-100 text-[13px] text-zinc-700 active:bg-zinc-50">弱チェリー</button>
                                                <button onClick={() => handleTrigger('STRONG_RARE')} className="flex-1 border-b border-zinc-100 text-[13px] text-zinc-700 active:bg-zinc-50">強レア役</button>
                                                <button onClick={() => handleTrigger('STRONG_CHERRY')} className="flex-1 border-b border-zinc-100 text-[13px] text-sky-600 active:bg-sky-50">強チェリー</button>
                                                <button onClick={() => setShowRareMenu(false)} className="h-9 bg-zinc-50 text-[11px] text-zinc-400">閉じる</button>
                                            </div>
                                        )}
                                    </div>
                                    <div className="grid grid-rows-2 gap-2.5">
                                        <button onClick={() => handleTrigger('BELL_7')} className="btn-base t-btn">ベル7回</button>
                                        <div className="grid grid-cols-3 gap-2">
                                            <button onClick={handle100G} className="btn-base t-btn sm flex-col gap-0 px-1"><span className="text-[11px]">100G</span><span className="text-[9px] text-zinc-400 font-normal">消化</span></button>
                                            <button onClick={handleJohannesburg} className="btn-base t-btn sm px-1 leading-tight text-[9.5px]">ヨハネス<br/>ブルグ</button>
                                            <button onClick={handleCeiling} className="btn-base t-btn sm flex-col gap-0 px-1"><span className="text-[11px]">天井</span><span className="text-[9px] text-zinc-400 font-normal">到達</span></button>
                                        </div>
                                    </div>
                                </div>

                                <div className="t-card space-y-3.5">
                                    <div className="flex items-center justify-between gap-2">
                                        <h3 className="t-sec">フェーズ進行</h3>
                                        {/* どん底(前兆)滞在時のバッジ表示 */}
                                        {simState.isDondoko && !simState.inCE && (
                                            <span className="t-chip">どん底滞在 — 発展濃厚</span>
                                        )}
                                    </div>

                                    <div className="flex gap-2 items-stretch">
                                        <button
                                            onClick={handleTogglePrecursor}
                                            disabled={simState.inCE || simState.isPrecursor}
                                            className={`btn-base w-14 flex-none rounded-[9px] border flex flex-col items-center justify-center gap-0.5 py-2.5 transition-colors ${
                                                (simState.isPrecursor && !simState.inCE)
                                                ? 'bg-sky-600 border-sky-600 text-white cursor-default'
                                                : 'bg-white border-zinc-200 text-zinc-300'
                                            }`}
                                        >
                                            <span className="text-[9px] tracking-wide opacity-80">STEP 1</span>
                                            <span className="text-[11.5px] font-medium">前兆</span>
                                        </button>

                                        <span className="flex items-center text-zinc-300 text-[11px]">›</span>

                                        <div className="flex-1 flex gap-1.5">
                                            <button onClick={handleNotDev} disabled={!simState.isPrecursor || simState.inCE || simState.isDondoko}
                                                className={`btn-base flex-1 rounded-[9px] border flex flex-col items-center justify-center gap-0 py-2 text-[11px] ${(!simState.isPrecursor || simState.inCE || simState.isDondoko) ? 'bg-zinc-50 border-zinc-100 text-zinc-300' : 'bg-white border-zinc-200 text-zinc-700'}`}>
                                                <span>非発展</span><span className="text-[9px] text-zinc-400">(終了)</span>
                                            </button>

                                            <button onClick={handleDirectDondoko} disabled={!simState.isPrecursor || simState.inCE || simState.isDondoko || simState.isSecondCE}
                                                className={`btn-base flex-1 rounded-[9px] border flex flex-col items-center justify-center gap-0 py-2 text-[11px] ${(!simState.isPrecursor || simState.inCE || simState.isDondoko || simState.isSecondCE) ? 'bg-zinc-50 border-zinc-100 text-zinc-300' : 'bg-white border-zinc-200 text-zinc-700'}`}>
                                                <span>どん底</span><span className="text-[9px] text-zinc-400">(直行)</span>
                                            </button>

                                            <button onClick={handleDev} disabled={!simState.isPrecursor || simState.inCE}
                                                className={`btn-base flex-1 rounded-[9px] border flex flex-col items-center justify-center gap-0 py-2 text-[11px] ${(!simState.isPrecursor || simState.inCE) ? 'bg-zinc-50 border-zinc-100 text-zinc-300' : 'bg-white border-sky-200 text-sky-600'}`}>
                                                <span>発展</span><span className="text-[9px] opacity-70">(連演へ)</span>
                                            </button>
                                        </div>
                                    </div>

                                    <div className={`rounded-[10px] p-3 border ${simState.inCE ? 'bg-sky-50/60 border-sky-200' : 'bg-zinc-50 border-zinc-100 opacity-60'}`}>
                                        <div className="flex items-center gap-2 mb-2.5">
                                            <span className={`text-[11px] font-medium ${simState.inCE ? 'text-sky-700' : 'text-zinc-400'}`}>
                                                STEP 2 — 連続演出
                                            </span>
                                            {simState.isSecondCE && <span className="t-chip">2回目</span>}
                                        </div>
                                        <div className="grid grid-cols-3 gap-2">
                                            <button onClick={handleFailNext} disabled={!simState.inCE || simState.isSecondCE}
                                                className={`btn-base rounded-[9px] border py-2.5 text-[11px] flex flex-col items-center justify-center gap-0 ${(!simState.inCE || simState.isSecondCE) ? 'bg-zinc-100 border-zinc-200 text-zinc-300' : 'bg-white border-zinc-200 text-zinc-700'}`}>
                                                失敗<span className="text-[9px] text-zinc-400">(どん底へ)</span>
                                            </button>
                                            <button onClick={handleFailEnd} disabled={!simState.inCE}
                                                className={`btn-base rounded-[9px] border py-2.5 text-[11px] flex flex-col items-center justify-center gap-0 ${!simState.inCE ? 'bg-zinc-100 border-zinc-200 text-zinc-300' : 'bg-white border-zinc-200 text-zinc-700'}`}>
                                                失敗<span className="text-[9px] text-zinc-400">(通常へ)</span>
                                            </button>
                                            <button onClick={handleSuccess} disabled={!simState.inCE}
                                                className={`btn-base rounded-[9px] border py-2.5 text-[11px] flex flex-col items-center justify-center gap-0 ${!simState.inCE ? 'bg-zinc-100 border-zinc-200 text-zinc-300' : 'bg-sky-600 border-sky-600 text-white'}`}>
                                                成功<span className="text-[9px] opacity-80">(CZ当選)</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* 設定示唆（カウント項目・計算内容は変更なし） */}
                                <div className="space-y-2.5">
                                    <h3 className="t-sec">設定示唆絞り込み</h3>
                                    <div className="grid grid-cols-2 gap-2">
                                        {[['set2', '設定2以上'], ['set3', '設定3以上'], ['set4', '設定4以上'], ['set5', '設定5以上']].map(([key, label]) => (
                                            <button key={key} onClick={() => setCounters(p => ({...p, suggestions: {...p.suggestions, [key]: !p.suggestions[key] }}))}
                                                className={`btn-base t-btn sm ${counters.suggestions[key] ? 'sel' : ''}`}>{label}</button>
                                        ))}
                                    </div>
                                </div>

                                {/* AT終了画面（メモ） */}
                                <div className="space-y-2.5">
                                    <h3 className="t-sec">AT終了画面（メモ）</h3>
                                    <div className="t-card divide-y divide-zinc-100 py-0">
                                        {[{k:'default',l:'デフォルト',s:null},{k:'highWeak',l:'高設定示唆［弱］',s:null},{k:'highStrong',l:'高設定示唆［強］',s:null},{k:'ka',l:'可',s:'設定2以上'},{k:'kichi',l:'吉',s:'設定3以上'},{k:'ryo',l:'良',s:'設定4以上'},{k:'yu',l:'優',s:'設定5以上'},{k:'kiwami',l:'極',s:'設定6濃厚'}].map(o=>(
                                            <div key={o.k} className="t-row">
                                                <div className="t-row-label">
                                                    <b className={o.s ? "on" : ""}>{o.l}</b>
                                                    {o.s && <small>{o.s}</small>}
                                                </div>
                                                <div className="t-step">
                                                    <button type="button" onClick={() => updateCounter(o.k, -1)} aria-label={`${o.l} を減らす`}>−</button>
                                                    <input type="number" inputMode="numeric" min="0" readOnly value={counters.atScreens[o.k]}
                                                        className={counters.atScreens[o.k] > 0 ? "on" : ""} />
                                                    <button type="button" onClick={() => updateCounter(o.k, 1)} aria-label={`${o.l} を増やす`}>＋</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="t-card">
                                    <div className="t-sec mb-2">履歴</div>
                                    <div className="h-32 overflow-y-auto scrollbar-hide">
                                        {simState.log.length === 0 && <div className="t-empty">履歴なし</div>}
                                        {simState.log.map((e, i) => (
                                            <div key={i} className="t-log">
                                                <span className={e.type==='result-good' ? 'text-sky-600 font-medium' : 'text-zinc-600'}>{e.text}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <button onClick={resetAll} className="btn-base t-btn danger w-full">全データをリセット</button>
                            </div>
                        ) : (
                            <div className="pt-4 space-y-3">
                                {/* 判別結果タブ（表示のみ） */}
                                <div className="t-panel">
                                    <div className="space-y-1.5">
                                        {[1, 2, 3, 4, 5, 6].map(numV => {
                                            const p = pct[numV] || 0;
                                            return (
                                                <div key={numV} className="flex items-center gap-2.5">
                                                    <span className="w-4 text-[11px] text-zinc-400 tabular-nums text-right">{numV}</span>
                                                    <div className="t-bar flex-1"><i className={`t-bar-${numV}`} style={{ width: `${p}%` }} /></div>
                                                    <span className="w-12 text-right text-xs tabular-nums text-zinc-700">{p.toFixed(1)}%</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <div className="grid grid-cols-3 gap-px bg-zinc-200 rounded-lg overflow-hidden mt-4 border border-zinc-200">
                                        {[
                                            ["奇数", (pct[1] + pct[3] + pct[5]).toFixed(1) + "%"],
                                            ["設定4+", (pct[4] + pct[5] + pct[6]).toFixed(1) + "%"],
                                            ["設定6", pct[6].toFixed(1) + "%"],
                                        ].map(([k, v]) => (
                                            <div key={k} className="bg-white py-2 text-center">
                                                <div className="text-[10px] text-zinc-400">{k}</div>
                                                <div className="text-[13px] tabular-nums text-zinc-900">{v}</div>
                                            </div>
                                        ))}
                                    </div>
                                    <p className="text-[11px] text-zinc-400 mt-3">初期値は設定1〜6均等（16.7%）</p>
                                </div>

                                <div className="t-card">
                                    <h3 className="t-sec mb-3">現在の状態推測（全設定）</h3>
                                    <div className="space-y-2">
                                        {SETTINGS.map(setting => (
                                            <div key={setting} className="flex items-center gap-2">
                                                <div className="text-[10px] w-4 text-zinc-400 text-right tabular-nums">{setting}</div>
                                                <div className="flex-1 flex text-[9px] text-center rounded overflow-hidden h-4 bg-zinc-100">
                                                    {STATE_NAMES.map((name, idx) => {
                                                        const prob = (simState.stateProbs?.[setting] || [])[idx] || 0;
                                                        const colors = ["bg-zinc-300 text-zinc-600", "bg-sky-300 text-sky-900", "bg-sky-500 text-white", "bg-sky-700 text-white"];
                                                        return prob > 0.001 ? <div key={idx} className={`${colors[idx]} flex items-center justify-center truncate transition-all duration-500`} style={{ width: `${prob * 100}%` }}>{(prob * 100) > 15 && name}</div> : null;
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex justify-end flex-wrap gap-x-3 gap-y-1 text-[10px] text-zinc-400 mt-3 pt-2.5 border-t border-zinc-100">
                                        <span className="flex items-center gap-1"><span className="w-2 h-2 bg-zinc-300 rounded-sm"></span>通常</span>
                                        <span className="flex items-center gap-1"><span className="w-2 h-2 bg-sky-300 rounded-sm"></span>高確A</span>
                                        <span className="flex items-center gap-1"><span className="w-2 h-2 bg-sky-500 rounded-sm"></span>高確B</span>
                                        <span className="flex items-center gap-1"><span className="w-2 h-2 bg-sky-700 rounded-sm"></span>超高確</span>
                                    </div>
                                </div>

                                <p className="t-sub pt-1">
                                    状態推移・連続演出の当落・設定示唆・AT終了画面のカウントからベイズ推定で算出しています。
                                    入力は「記録」タブでおこないます。
                                </p>
                            </div>
                        )}
                    </div>

                    {/* 下部タブ */}
                    <nav className="t-tabs">
                        <button onClick={() => { setActiveTab('main'); window.scrollTo(0,0); }} className={`t-tab ${activeTab === 'main' ? 'on' : ''}`}>
                            <IconRecord className="w-[18px] h-[18px]" />
                            記録
                        </button>
                        <button onClick={() => { setActiveTab('counter'); window.scrollTo(0,0); }} className={`t-tab ${activeTab === 'counter' ? 'on' : ''}`}>
                            <IconResult className="w-[18px] h-[18px]" />
                            判別結果
                        </button>
                    </nav>

                    {/* データ管理 */}
                    {showDataModal && (
                        <div className="t-modal" onClick={() => setShowDataModal(false)}>
                            <div className="t-modal-box" onClick={(e) => e.stopPropagation()}>
                                <h3>データ管理</h3>
                                <button onClick={copyToClipboard} className="btn-base t-btn w-full">現在の記録をコピー</button>
                                <div className="border-t border-zinc-100 mt-4 pt-4 space-y-2.5">
                                    <textarea className="t-ta" placeholder="ここに保存したデータを貼り付け" value={importText} onChange={(e) => setImportText(e.target.value)}></textarea>
                                    <button onClick={importData} className="btn-base t-btn on w-full">貼り付けたデータを読み込む</button>
                                </div>
                                <button onClick={() => setShowDataModal(false)} className="t-link w-full justify-center mt-3">キャンセル</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
