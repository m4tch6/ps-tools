const STORE_KEY = "kyokou_suiri_v1";

  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return fallback;
    return { ...fallback, ...JSON.parse(raw) };
  } catch (_) { return fallback; }
};
const persist = (v) => { try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch (_) {} };

// --- 数値ユーティリティ ---
const logBinom = (n, k, p) => {
  if (n <= 0 || k < 0) return 0;
  const kk = Math.min(k, n);
  if (p <= 0) return kk > 0 ? -Infinity : 0;
  if (p >= 1) return kk < n ? -Infinity : 0;
  return kk * Math.log(p) + (n - kk) * Math.log(1 - p);
};

const logCategorical = (counts, probsPct) => {
  const total = probsPct.reduce((a, b) => a + b, 0);
  if (total <= 0) return counts.some((c) => c > 0) ? -Infinity : 0;
  let ll = 0;
  for (let i = 0; i < counts.length; i++) {
    if (counts[i] > 0) {
      const p = probsPct[i] / total;
      if (p <= 0) return -Infinity;
      ll += counts[i] * Math.log(p);
    }
  }
  return ll;
};

const num = (v) => {
  const n = parseInt(v, 10);
  return Number.isFinite(n) && n >= 0 ? n : 0;
};

          type="button"
          onClick={() => onChange(String(v + step))}
          className="w-11 h-11 grid place-items-center text-zinc-500 bg-zinc-50 active:bg-zinc-100 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-sky-500"
          aria-label={`${label} を${step}増やす`}
        >
          ＋
        </button>
      </div>
    </div>
  );
}

// --- セクション ---
function Group({ title, note, children, defaultOpen = true }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <section className="border-b border-zinc-200">
      <button
        type="button"
        onClick={() => setOpen(!open)}
        className="w-full flex items-center justify-between gap-2 py-3.5 text-left focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-sky-500 rounded"
      >
        <span className="text-xs font-medium tracking-widest text-zinc-500">{title}</span>
        {open ? (
          <ChevronUp className="w-4 h-4 text-zinc-400 shrink-0" />
        ) : (
          <ChevronDown className="w-4 h-4 text-zinc-400 shrink-0" />
        )}
      </button>
      {open && (
        <div className="pb-4">
          {note && <p className="text-[11px] text-zinc-500 leading-relaxed mb-2">{note}</p>}
          <div>{children}</div>
        </div>
      )}
    </section>
  );
}

// --- 本体 ---
function KyokouSuiriTool() {
  const init = {
    games: "0",
    cz: "0",
    czDirect: "0",
    bonusDirect: "0",
    oneShotN: "0",
    oneShotK: "0",
    startEp: ["0", "0", "0", "0", "0"],
    epN: "0",
    epK: "0",
    useEp: false,
    ceilNormal: ["0", "0", "0", "0"],
    ceilReset: ["0", "0"],
    rb: ["0", "0", "0", "0", "0", "0", "0", "0"],
    endFreq: ["0", "0", "0", "0", "0"],
    endNoko: ["0", "0", "0", "0"],
    ed: ["0", "0", "0", "0", "0", "0"],
    trophy: "none",
  };
  const [s, setS] = useState(() => loadSaved(init));
  useEffect(() => { persist(s); }, [s]);
  const [zoom, setZoom] = useState(null); // { src, label }
  const set = (key, val) => setS((prev) => ({ ...prev, [key]: val }));
  const setArr = (key, idx, val) =>
    setS((prev) => {
      const arr = [...prev[key]];
      arr[idx] = val;
      return { ...prev, [key]: arr };
    });
  const onZoom = (src, label) => setZoom({ src, label });

  const result = useMemo(() => {
    const G = num(s.games);
    const cz = num(s.cz);
    const czD = Math.min(num(s.czDirect), cz);
    const bD = num(s.bonusDirect);
    const osN = num(s.oneShotN);
    const osK = num(s.oneShotK);
    const epCounts = s.startEp.map(num);
    const epN = num(s.epN);
    const epK = num(s.epK);
    const ceilN = s.ceilNormal.map(num);
    const ceilR = s.ceilReset.map(num);
    const rb = s.rb.map(num);
    const endFreq = s.endFreq.map(num);
    const endNoko = s.endNoko.map(num);
    const ed = s.ed.map(num);
    const nokoSum = endNoko.reduce((a, b) => a + b, 0);

    // 濃厚系の制約（トロフィー・濃厚画面・EDセリフ濃厚系）
    let minSetting = 1;
    const exacts = [];
    const trophy = TROPHY_OPTIONS.find((t) => t.key === s.trophy);
    if (trophy) {
      minSetting = Math.max(minSetting, trophy.min);
      if (trophy.exact) exacts.push(trophy.exact);
    }
    NOKO_SCREENS.forEach((e, i) => {
      if (endNoko[i] > 0) {
        minSetting = Math.max(minSetting, e.min);
        if (e.exact) exacts.push(e.exact);
      }
    });
    ED_ITEMS.forEach((e, i) => {
      if (e.min && ed[i] > 0) {
        minSetting = Math.max(minSetting, e.min);
        if (e.exact) exacts.push(e.exact);
      }
    });

    const logL = SETTINGS.map((_, i) => {
      let ll = 0;
      // CZ直撃はCZ当選の内数として分解（二重計上を回避）
      const pCzAll = 1 / DATA.czRate[i];
      const pCzD = 1 / DATA.czDirectRate[i];
      const pCzNormal = Math.max(pCzAll - pCzD, 1e-9);
      ll += logBinom(G, cz - czD, pCzNormal); // 直撃以外のCZ
      ll += logBinom(G, czD, pCzD); // CZ直撃
      ll += logBinom(G, bD, 1 / DATA.bonusDirectRate[i]); // ボーナス直撃
      ll += logBinom(osN, osK, DATA.oneShot[i]);
      ll += logCategorical(epCounts, DATA.startEp[i]);
      if (s.useEp) ll += logBinom(epN, epK, DATA.epEntry[i]);
      ll += logCategorical(ceilN, DATA.ceilNormal[i]);
      ll += logCategorical(ceilR, DATA.ceilReset[i]);
      ll += logCategorical(rb, DATA.rbChar[i]);
      // 終了画面: 非濃厚5種＋濃厚合算の6カテゴリで尤度計算
      // （濃厚の個別内訳は非公開のため合算値1.3〜2.9%で評価）
      ll += logCategorical(
        [...endFreq, nokoSum],
        [...DATA.endScreen[i], DATA.nokoTotal[i]]
      );
      // EDセリフは振り分け非公開のため尤度には不使用（濃厚系の制約のみ）
      return ll;
    });

    const allowed = SETTINGS.map((v) => v >= minSetting && exacts.every((e) => v === e));
    const finite = logL.filter((v, i) => allowed[i] && v > -Infinity);
    const maxLL = finite.length ? Math.max(...finite) : -Infinity;
    const weights = logL.map((ll, i) =>
      allowed[i] && ll > -Infinity ? Math.exp(ll - maxLL) : 0
    );
    const total = weights.reduce((a, b) => a + b, 0);
    const invalid = total <= 0;
    const post = invalid ? SETTINGS.map(() => 1 / 6) : weights.map((w) => w / total);

    const odd = post[0] + post[2] + post[4];
    const high = post[3] + post[4] + post[5];
    const expPayout = post.reduce((a, p, i) => a + p * DATA.payout[i], 0);
    const hasData =
      G > 0 || osN > 0 || epCounts.some((c) => c > 0) || (s.useEp && epN > 0) ||
      ceilN.some((c) => c > 0) || ceilR.some((c) => c > 0) || rb.some((c) => c > 0) ||
      endFreq.some((c) => c > 0) || nokoSum > 0 ||
      ed.some((c, i) => ED_ITEMS[i].min && c > 0) || minSetting > 1 || exacts.length > 0;

    return { post, odd, high, expPayout, invalid, hasData, minSetting };
  }, [s]);

  const dim = !result.hasData || result.invalid;

  return (
    <div className="min-h-screen bg-white text-zinc-700 antialiased">
      <div className="max-w-md mx-auto px-4 pb-28">
        {/* ヘッダー */}
        <header className="pt-6 pb-4 flex items-baseline justify-between gap-2">
          <h1 className="text-base font-semibold tracking-wide text-zinc-900">
            L虚構推理<span className="text-zinc-400 font-normal ml-2 text-sm">設定判別</span>
          </h1>
          <button
            type="button"
            onClick={() => setS(init)}
            className="flex items-center gap-1 text-[11px] text-zinc-400 active:text-zinc-700 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-sky-500 rounded px-1 py-0.5"
          >
            <RotateCcw className="w-3 h-3" />
            リセット
          </button>
        </header>

        {/* 推定結果 */}
        <div className="rounded-xl border border-zinc-200 bg-zinc-50 p-4 mb-2 shadow-sm">
          <div className={`space-y-1.5 ${dim ? "opacity-40" : ""}`}>
            {SETTINGS.map((v, i) => (
              <div key={v} className="flex items-center gap-2.5">
                <span className="w-4 text-[11px] text-zinc-400 tabular-nums text-right">{v}</span>
                <div className="flex-1 h-2 bg-zinc-200 rounded-full overflow-hidden">
                  <div
                    className={`h-full rounded-full ${BAR[i]} transition-[width] duration-300`}
                    style={{ width: `${fmt(result.post[i])}%` }}
                  />
                </div>
                <span className="w-12 text-right text-xs tabular-nums text-zinc-700">
                  {fmt(result.post[i])}%
                </span>
              </div>
            ))}
          </div>

          <div className="grid grid-cols-4 gap-px bg-zinc-200 rounded-lg overflow-hidden mt-4 border border-zinc-200">
            {[
              ["奇数", fmt(result.odd) + "%"],
              ["設定4+", fmt(result.high) + "%"],
              ["設定6", fmt(result.post[5]) + "%"],
              ["出玉率", result.expPayout.toFixed(1) + "%"],
            ].map(([k, v]) => (
              <div key={k} className="bg-white py-2 text-center">
                <div className="text-[10px] text-zinc-400">{k}</div>
                <div className={`text-[13px] tabular-nums ${dim ? "text-zinc-300" : "text-zinc-900"}`}>
                  {dim ? "—" : v}
                </div>
              </div>
            ))}
          </div>

          {result.invalid && result.hasData ? (
            <p className="text-[11px] text-amber-600 mt-3 leading-relaxed">
              入力が矛盾しています。濃厚演出のカウントと出現率0%項目を確認してください。
            </p>
          ) : result.minSetting > 1 ? (
            <p className="text-[11px] text-sky-600 mt-3">
              濃厚演出により設定{result.minSetting}以上に限定
            </p>
          ) : !result.hasData ? (
            <p className="text-[11px] text-zinc-400 mt-3">カウント入力で推定を開始します</p>
          ) : null}
        </div>

        {/* 通常時 */}
        <Group
          title="通常時"
          note="直撃はどちらも共通ベル契機。CZ直撃はCZ当選の内数として入力してください（内部で二重計上を除いて計算）。初当り確率はCZ突入率×突破率に連動するため入力対象外です。"
        >
          <div className="divide-y divide-zinc-100">
            <Row label="総ゲーム数" sub="±100" value={s.games} onChange={(v) => set("games", v)} step={100} />
            <Row label="CZ当選（合算）" sub="1/124.5 〜 1/103.5" value={s.cz} onChange={(v) => set("cz", v)} />
            <Row label="うちCZ直撃" sub="1/2822 〜 1/2427" value={s.czDirect} onChange={(v) => set("czDirect", v)} />
            <Row label="ボーナス直撃" sub="1/6684 〜 1/2427" value={s.bonusDirect} onChange={(v) => set("bonusDirect", v)} />
          </div>
        </Group>

        {/* CZ */}
        <Group
          title="CZ"
          note="開始エピソードは初回CZのみ対象。駆け抜け後・設定変更後1回目は全設定共通のため除外してください。"
        >
          <div className="divide-y divide-zinc-100">
            <Row label="CZ突入数（一撃突破の母数）" value={s.oneShotN} onChange={(v) => set("oneShotN", v)} />
            <Row label="一撃突破" sub="開始時ムービー告知／2.2〜5.1%" value={s.oneShotK} onChange={(v) => set("oneShotK", v)} />
            <Row label="EP1スタート" value={s.startEp[0]} onChange={(v) => setArr("startEp", 0, v)} />
            <Row label="EP2スタート" value={s.startEp[1]} onChange={(v) => setArr("startEp", 1, v)} />
            <Row label="EP3スタート" value={s.startEp[2]} onChange={(v) => setArr("startEp", 2, v)} />
            <Row label="EP4スタート" sub="設定4以上濃厚" accent value={s.startEp[3]} onChange={(v) => setArr("startEp", 3, v)} />
            <Row label="EP5スタート" sub="設定6濃厚" accent value={s.startEp[4]} onChange={(v) => setArr("startEp", 4, v)} />
          </div>
          <div className="pt-3">
            <label className="flex items-center gap-2.5 min-h-11 text-[13px] text-zinc-700 cursor-pointer">
              <input
                type="checkbox"
                checked={s.useEp}
                onChange={() => set("useEp", !s.useEp)}
                className="w-4 h-4 accent-sky-600"
              />
              <span>
                EP突入時突破（白ランプ）を含める
                <span className="block text-[11px] text-zinc-400">ストック消化を含むため上振れ・参考値</span>
              </span>
            </label>
            {s.useEp && (
              <div className="divide-y divide-zinc-100">
                <Row label="エピソード挑戦数" value={s.epN} onChange={(v) => set("epN", v)} />
                <Row label="白ランプクリア" sub="36.6〜46.4%" value={s.epK} onChange={(v) => set("epK", v)} />
              </div>
            )}
          </div>
        </Group>

        {/* 天井 */}
        <Group
          title="天井ゲーム数"
          note="虚構真偽間の天井到達G数をカウント。その日リセットの有無で使う欄が変わります。"
        >
          <div className="text-[11px] font-medium text-zinc-500 pt-1 pb-0.5">通常営業（据え置き／リセット不明）</div>
          <div className="divide-y divide-zinc-100">
            <Row label="100G" sub="全設定共通0.05%・判別影響なし" value={s.ceilNormal[0]} onChange={(v) => setArr("ceilNormal", 0, v)} />
            <Row label="300G" sub="0.6〜2.5%" value={s.ceilNormal[1]} onChange={(v) => setArr("ceilNormal", 1, v)} />
            <Row label="700G" sub="12.1〜22.5%" value={s.ceilNormal[2]} onChange={(v) => setArr("ceilNormal", 2, v)} />
            <Row label="1000G" value={s.ceilNormal[3]} onChange={(v) => setArr("ceilNormal", 3, v)} />
          </div>

          <div className="mt-4 rounded-lg border border-zinc-300 bg-zinc-100/70 px-3 py-2.5">
            <div className="flex items-center gap-2 mb-1">
              <span className="text-[10px] font-semibold tracking-wide text-white bg-zinc-500 rounded px-1.5 py-0.5">
                リセット確定日のみ
              </span>
              <span className="text-[11px] font-medium text-zinc-600">設定変更後の天井</span>
            </div>
            <p className="text-[11px] text-zinc-500 leading-relaxed mb-1">
              リセット後は天井が最大700Gに短縮（300Gもあり）。上の通常欄とは別集計です。設定変更が確定している場合のみ入力してください。
            </p>
            <div className="divide-y divide-zinc-200">
              <Row label="300G（リセット時）" sub="6.3〜10.2%" value={s.ceilReset[0]} onChange={(v) => setArr("ceilReset", 0, v)} />
              <Row label="700G（リセット時）" value={s.ceilReset[1]} onChange={(v) => setArr("ceilReset", 1, v)} />
            </div>
          </div>
        </Group>

        {/* RB中キャラ */}
        <Group title="RB（あやかしぼーなす）中キャラ紹介">
          <div className="divide-y divide-zinc-100">
            {RB_ITEMS.map((item, i) => (
              <Row
                key={i}
                label={item.label}
                sub={item.sub}
                accent={item.accent}
                value={s.rb[i]}
                onChange={(v) => setArr("rb", i, v)}
              />
            ))}
          </div>
        </Group>

        {/* 終了画面 */}
        <Group
          title="虚構推理ボーナス（SUPER）終了画面"
          note="出た終了画面をすべて回数でカウント。濃厚画面は個別の出現率が非公開のため、合算出現率（設定2: 1.3% 〜 設定6: 2.9%／設定1は出現なし）で頻度を評価しつつ、示唆内容（設定◯以上）で設定を絞り込みます。画像タップで拡大。"
        >
          <div className="text-[11px] font-medium text-zinc-500 pt-1 pb-0.5">通常画面</div>
          <div className="divide-y divide-zinc-100">
            {END_SCREEN_FREQ.map((e, i) => (
              <Row
                key={i}
                label={e.label}
                sub={e.sub}
                img={e.img}
                onZoom={onZoom}
                accent={e.accent}
                value={s.endFreq[i]}
                onChange={(v) => setArr("endFreq", i, v)}
              />
            ))}
          </div>

          <div className="text-[11px] font-medium text-zinc-500 pt-3 pb-0.5">濃厚画面</div>
          <div className="divide-y divide-zinc-100">
            {NOKO_SCREENS.map((e, i) => (
              <Row
                key={i}
                label={e.label}
                sub={e.sub}
                img={e.img}
                onZoom={onZoom}
                accent
                value={s.endNoko[i]}
                onChange={(v) => setArr("endNoko", i, v)}
              />
            ))}
          </div>
        </Group>

        {/* EDセリフ */}
        <Group
          title="エンディング中のセリフ（ランプ色）"
          note="振り分けが非公開のため、青・黄・緑・および濃厚系の出現頻度は尤度計算に使用しません（将来解析が出た際の参考記録）。紫・赤・虹は1回でも出現すれば該当設定以上に絞り込んで計算します。"
        >
          <div className="divide-y divide-zinc-100">
            {ED_ITEMS.map((e, i) => (
              <Row
                key={i}
                label={e.label}
                sub={e.sub}
                dot={e.dot}
                rainbow={e.rainbow}
                accent={e.accent}
                value={s.ed[i]}
                onChange={(v) => setArr("ed", i, v)}
              />
            ))}
          </div>
        </Group>

        {/* トロフィー */}
        <Group title="ダイナマイトトロフィー">
          <div className="py-2.5">
            <div className="text-[13px] text-zinc-700 mb-1.5">出現した最上位のもの</div>
            <select
              value={s.trophy}
              onChange={(e) => set("trophy", e.target.value)}
              className="w-full h-11 rounded-lg bg-white border border-zinc-200 text-[13px] text-zinc-800 px-3 focus:outline-none focus:ring-1 focus:ring-sky-500"
            >
              {TROPHY_OPTIONS.map((t) => (
                <option key={t.key} value={t.key}>{t.label}</option>
              ))}
            </select>
          </div>
        </Group>

        <footer className="pt-4">
          <p className="text-[10px] text-zinc-400 leading-relaxed">
            事前確率は設定1〜6均等のベイズ推定。解析値はちょんぼりすた掲載値（2026/6時点）。
            CZ直撃・ボーナス直撃は共通ベル契機として区別し、CZ直撃はCZ当選の内数として計算。
            終了画面は非濃厚5種＋濃厚合算の6カテゴリで尤度評価し、濃厚画面の示唆内容とEDセリフ濃厚系は設定除外に使用。
            弱レア役の高確移行・低確中CZ当選率は判別不能のため未使用。
            終了画面の画像はユーザー個人収集のもの。
          </p>
        </footer>
      </div>

      {/* 画像ズームオーバーレイ */}
      {zoom && (
        <div
          className="fixed inset-0 z-30 bg-black/75 flex items-center justify-center p-6"
          onClick={() => setZoom(null)}
          role="dialog"
          aria-label={`${zoom.label} の拡大画像`}
        >
          <div className="max-w-sm w-full" onClick={(e) => e.stopPropagation()}>
            <img src={zoom.src} alt={zoom.label} className="w-full rounded-lg" />
            <div className="flex items-center justify-between mt-2">
              <span className="text-sm text-white">{zoom.label}</span>
              <button
                type="button"
                onClick={() => setZoom(null)}
                className="flex items-center gap-1 text-sm text-zinc-300 active:text-white px-2 py-1"
              >
                <X className="w-4 h-4" />
                閉じる
              </button>
            </div>
          </div>
        </div>
      )}

      {/* 下部固定サマリー */}
      <div className="fixed bottom-0 inset-x-0 z-20 border-t border-zinc-200 bg-white/95 backdrop-blur">
        <div className="max-w-md mx-auto px-4 pt-2.5 pb-[calc(0.625rem+env(safe-area-inset-bottom))]">
          <div className={`flex h-1.5 rounded-full overflow-hidden bg-zinc-100 ${dim ? "opacity-40" : ""}`}>
            {SETTINGS.map((v, i) => (
              <div
                key={v}
                className={`${BAR[i]} transition-[width] duration-300`}
                style={{ width: `${fmt(result.post[i])}%` }}
              />
            ))}
          </div>
          <div className="flex justify-between mt-1.5 text-[11px] tabular-nums">
            {result.invalid && result.hasData ? (
              <span className="text-amber-600">入力矛盾 — 濃厚カウントと0%項目を確認</span>
            ) : (
              <>
                <span className="text-zinc-400">
                  設定4+ <span className={dim ? "text-zinc-300" : "text-sky-600 font-medium"}>{dim ? "—" : fmt(result.high) + "%"}</span>
                </span>
                <span className="text-zinc-400">
                  設定6 <span className={dim ? "text-zinc-300" : "text-sky-600 font-medium"}>{dim ? "—" : fmt(result.post[5]) + "%"}</span>
                </span>
                <span className="text-zinc-400">
                  出玉率 <span className={dim ? "text-zinc-300" : "text-zinc-900 font-medium"}>{dim ? "—" : result.expPayout.toFixed(1) + "%"}</span>
                </span>
              </>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<KyokouSuiriTool />);
</script>
</body>
</html>
